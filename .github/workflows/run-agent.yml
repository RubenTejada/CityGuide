name: Run agent (daily)

# Daily ingestion run: 10:17 UTC = 6:17 AM in Santo Domingo (AST, UTC-4).
# The subscription caps Container Apps environments at 1 (used by another
# project), so the scheduled run lives here instead of a Container Apps Job.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      section:
        description: >-
          Limit the run to these sections (comma-separated), matched against
          any segment of a Run's ParentPath, plus "cines"/"eventos". Empty
          runs everything, like the daily schedule.
        required: false
        default: ""
      recategorize_events:
        description: >-
          Maintenance pass instead of the ingestion run: recategorizes the
          events the agent created (the imported ones carried no category until
          the sync learned to ask the model for one) and writes the result.
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # DefaultAzureCredential in AzureOpenAiClient falls back to the Azure CLI
      # login this step provides (the principal has Cognitive Services OpenAI User).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run ingestion agent
        working-directory: CityGuide.Agent
        env:
          Umbraco__BaseUrl: https://quehacerrd-cms.azurewebsites.net
          Umbraco__ClientSecret: ${{ secrets.UMBRACO_AGENT_CLIENT_SECRET }}
          Google__ApiKey: ${{ secrets.GOOGLE_API_KEY }}
          # IMDb / Rotten Tomatoes scores on the movie catalog. Missing secrets
          # only mean no scores: the cinema sync runs exactly as before.
          Cinemas__Ratings__TmdbApiKey: ${{ secrets.TMDB_API_KEY }}
          Cinemas__Ratings__OmdbApiKey: ${{ secrets.OMDB_API_KEY }}
          SECTION: ${{ inputs.section }}
          RECATEGORIZE: ${{ inputs.recategorize_events }}
        # The scheduled run has no inputs, so both are empty and the agent runs
        # every section, as before.
        run: |
          if [ "$RECATEGORIZE" = "true" ]; then
            dotnet run -c Release -- --recategorize-events --apply
          elif [ -n "$SECTION" ]; then
            dotnet run -c Release -- --section "$SECTION"
          else
            dotnet run -c Release
          fi
