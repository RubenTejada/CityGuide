name: Run agent

# Manual runs only. The daily schedule (10:17 UTC) is off: the rating and photo
# backfill asked Google about every published node on every pass, which is billed
# per request and ran to about fifty euros in two days. Restore the "schedule"
# trigger once the pass only spends what a day of drift is worth.
on:
  workflow_dispatch:
    inputs:
      section:
        description: >-
          Limit the run to these sections (comma-separated), matched against
          any segment of a Run's ParentPath, plus "cines"/"eventos". Empty
          runs everything, like the daily schedule.
        required: false
        default: ""
      recategorize_events:
        description: >-
          Maintenance pass instead of the ingestion run: recategorizes the
          events the agent created (the imported ones carried no category until
          the sync learned to ask the model for one) and writes the result.
        type: boolean
        required: false
        default: false
      purge_foreign_events:
        description: >-
          Maintenance pass instead of the ingestion run: sends to the recycle bin
          the events the agent imported that do not happen in the city (every ticket
          portal lists the whole country). "plan" only prints what it would remove.
        type: choice
        required: false
        options:
          - "no"
          - plan
          - apply
        default: "no"
      regroup_malls:
        description: >-
          Maintenance pass instead of the ingestion run: recreates a plaza stored
          as a shop with the "mall" type and sends the agent's plaza duplicates
          to the recycle bin. "plan" only prints what it would do.
        type: choice
        required: false
        options:
          - "no"
          - plan
          - apply
        default: "no"
      link_malls:
        description: >-
          Maintenance pass instead of the ingestion run: lists under each plaza every
          place that sits inside it but lives elsewhere in the tree (a bank branch
          under its company, a restaurant under its cuisine). "plan" only prints.
        type: choice
        required: false
        options:
          - "no"
          - plan
          - apply
        default: "no"
      merge_mall_from:
        description: >-
          Maintenance pass instead of the ingestion run: name of the plaza to fold
          into merge_mall_into — its establishments move there, the surviving plaza
          picks up the Google place id and rating it lacks, and this one goes to the
          recycle bin. For the duplicate Google names its own way.
        required: false
        default: ""
      merge_mall_into:
        description: The plaza that stays. Required with merge_mall_from.
        required: false
        default: ""
      merge_mall_apply:
        description: Write the merge. Left off, it only prints what it would do.
        type: boolean
        required: false
        default: false
      move_place_from:
        description: >-
          Maintenance pass instead of the ingestion run: content path of a node to
          file under another parent (move_place_to) — an establishment parented by a
          plaza, whose real section only a person knows. The plaza keeps listing it
          by reference.
        required: false
        default: ""
      move_place_to:
        description: Content path of the new parent. Required with move_place_from.
        required: false
        default: ""
      move_place_apply:
        description: Write the move. Left off, it only prints what it would do.
        type: boolean
        required: false
        default: false
      purge_duplicate_places:
        description: >-
          Maintenance pass instead of the ingestion run: sends to the recycle bin the
          copies of a place earlier passes created ("Dolce Italia (1)", "(2)") and clears
          the place id a branch borrowed from its plaza. "plan" only prints what it would do.
        type: choice
        required: false
        options:
          - "no"
          - plan
          - apply
        default: "no"
      paid:
        description: >-
          Let the run use the two services that charge: Google Places (billed per
          request, and the backfill makes one per node it refreshes) and the
          enrichment model (billed per token). Left off, the run does only what
          costs nothing — cines, eventos, enlace de plazas y publicación.
        type: boolean
        required: false
        default: false
      publish:
        description: >-
          Kept for the runs configured to draft instead of publish. The agent
          publishes what it writes and sweeps the drafts left under the sections
          it covered, so this changes nothing on the default configuration.
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # DefaultAzureCredential in AzureOpenAiClient falls back to the Azure CLI
      # login this step provides (the principal has Cognitive Services OpenAI User).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run ingestion agent
        working-directory: CityGuide.Agent
        env:
          Umbraco__BaseUrl: https://quehacerrd-cms.azurewebsites.net
          Umbraco__ClientSecret: ${{ secrets.UMBRACO_AGENT_CLIENT_SECRET }}
          Google__ApiKey: ${{ secrets.GOOGLE_API_KEY }}
          # IMDb / Rotten Tomatoes scores on the movie catalog. Missing secrets
          # only mean no scores: the cinema sync runs exactly as before.
          Cinemas__Ratings__TmdbApiKey: ${{ secrets.TMDB_API_KEY }}
          Cinemas__Ratings__OmdbApiKey: ${{ secrets.OMDB_API_KEY }}
          SECTION: ${{ inputs.section }}
          RECATEGORIZE: ${{ inputs.recategorize_events }}
          PURGE_FOREIGN: ${{ inputs.purge_foreign_events }}
          REGROUP: ${{ inputs.regroup_malls }}
          LINK: ${{ inputs.link_malls }}
          MERGE_FROM: ${{ inputs.merge_mall_from }}
          MERGE_INTO: ${{ inputs.merge_mall_into }}
          MERGE_APPLY: ${{ inputs.merge_mall_apply }}
          MOVE_FROM: ${{ inputs.move_place_from }}
          MOVE_TO: ${{ inputs.move_place_to }}
          MOVE_APPLY: ${{ inputs.move_place_apply }}
          PURGE_DUPLICATES: ${{ inputs.purge_duplicate_places }}
          PUBLISH: ${{ inputs.publish }}
          PAID: ${{ inputs.paid }}
        run: |
          # Everything the agent uses is free except Google Places and the enrichment
          # model. Without this flag it leaves both alone and the run cannot be billed.
          paid_flag=""
          if [ "$PAID" = "true" ]; then paid_flag="--paid"; fi
          if [ "$RECATEGORIZE" = "true" ]; then
            dotnet run -c Release -- --recategorize-events --apply $paid_flag
          elif [ "$PURGE_FOREIGN" = "plan" ]; then
            dotnet run -c Release -- --purge-foreign-events $paid_flag
          elif [ "$PURGE_FOREIGN" = "apply" ]; then
            dotnet run -c Release -- --purge-foreign-events --apply $paid_flag
          elif [ "$LINK" = "plan" ]; then
            dotnet run -c Release -- --link-malls $paid_flag
          elif [ "$LINK" = "apply" ]; then
            dotnet run -c Release -- --link-malls --apply $paid_flag
          elif [ -n "$MERGE_FROM" ] && [ -n "$MERGE_INTO" ]; then
            if [ "$MERGE_APPLY" = "true" ]; then
              dotnet run -c Release -- --merge-mall "$MERGE_FROM" "$MERGE_INTO" --apply $paid_flag
            else
              dotnet run -c Release -- --merge-mall "$MERGE_FROM" "$MERGE_INTO" $paid_flag
            fi
          elif [ -n "$MOVE_FROM" ] && [ -n "$MOVE_TO" ]; then
            if [ "$MOVE_APPLY" = "true" ]; then
              dotnet run -c Release -- --move-place "$MOVE_FROM" "$MOVE_TO" --apply $paid_flag
            else
              dotnet run -c Release -- --move-place "$MOVE_FROM" "$MOVE_TO" $paid_flag
            fi
          elif [ "$PURGE_DUPLICATES" = "plan" ]; then
            dotnet run -c Release -- --purge-duplicate-places $paid_flag
          elif [ "$PURGE_DUPLICATES" = "apply" ]; then
            dotnet run -c Release -- --purge-duplicate-places --apply $paid_flag
          elif [ "$REGROUP" = "plan" ]; then
            dotnet run -c Release -- --regroup-malls $paid_flag
          elif [ "$REGROUP" = "apply" ]; then
            dotnet run -c Release -- --regroup-malls --apply $paid_flag
          elif [ -n "$SECTION" ] && [ "$PUBLISH" = "true" ]; then
            dotnet run -c Release -- --section "$SECTION" --publish $paid_flag
          elif [ -n "$SECTION" ]; then
            dotnet run -c Release -- --section "$SECTION" $paid_flag
          else
            dotnet run -c Release -- $paid_flag
          fi
