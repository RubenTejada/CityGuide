name: Build agent image

on:
  push:
    branches: [main]
    paths:
      - "CityGuide.Agent/**"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The daily Container Apps Job (cityguide-agent) pulls :latest on each run,
      # so pushing a new image is enough to "deploy" the agent. Built on the
      # runner (ACR Tasks is not permitted on this subscription).
      - name: Build and push image
        run: |
          az acr login -n quehacerrd
          docker build -f CityGuide.Agent/Dockerfile -t quehacerrd.azurecr.io/cityguide-agent:latest .
          docker push quehacerrd.azurecr.io/cityguide-agent:latest
