name: Deploy frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  UMBRACO_BASE_URL: https://quehacerrd-cms.azurewebsites.net
  NEXT_PUBLIC_UMBRACO_BASE_URL: https://quehacerrd-cms.azurewebsites.net
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: G-RTX0GNHR74
  # Inlined by `next build`, so it has to be here and not only in the
  # App Service settings. The Conversions API token is read at runtime
  # instead: it is a secret and belongs in the app settings.
  NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      # Standalone output: server.js + minimal node_modules; static assets and
      # public/ are served by the same server but must be copied in manually.
      - name: Package standalone build
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: quehacerrd-web
          package: frontend/.next/standalone

      # The zip deploy lands the new files but leaves the running node process
      # alone, so the site keeps serving the previous build — a deploy that
      # reports success and changes nothing. Restarting is what publishes it.
      - name: Restart app
        run: az webapp restart -g cityguide-rg -n quehacerrd-web
